name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=src --cov=api --cov-report=term-missing

      - name: Generate synthetic data
        run: python data/generate_synthetic_data.py

      - name: Run preprocessing pipeline
        run: |
          python src/data_pipeline.py
          python src/feature_engineering.py

      - name: Train baseline model
        run: python src/train.py --model logistic_regression

      - name: Evaluate baseline model
        run: python src/evaluate.py --model logistic_regression

      - name: Build model comparison report
        run: python src/compare_models.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-artifacts
          path: |
            models/
            reports/
            experiments/
          if-no-files-found: warn
